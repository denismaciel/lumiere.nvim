name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/check_palette.py
      - run: sudo apt-get update && sudo apt-get install --yes neovim
      - run: nvim --clean --headless -l tests/highlights.lua
